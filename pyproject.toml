[project]
name = "agent-eval"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepeval>=4",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-openai>=1.8.5",
    "langsmith>=0.16.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rich>=13.6,<15",
]

[project.scripts]
agent-cli = "agent.cli:main"
eval-runner = "agent.evaluation_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
